# Publishes the static site to the `gh-pages` branch, which GitHub Pages serves at
# https://<user>.github.io/<repo>/  (Settings → Pages → Deploy from a branch → gh-pages / root).
name: Publish site (gh-pages)

on:
  push:
    branches: [main, ccr-7a4345da-w1un2r]
    paths-ignore: ['**.md', 'self-host/**', '*.zip', 'server/Dockerfile', 'server/docker-compose.yml', 'server/requirements.txt']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Collect site files
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest icon.svg .nojekyll css js vendor _site/
          mkdir -p _site/server && cp server/getvid_server.py server/oracle-setup.sh _site/server/

      - name: Push to gh-pages
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish ${GITHUB_SHA::7} from ${GITHUB_REF_NAME}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
